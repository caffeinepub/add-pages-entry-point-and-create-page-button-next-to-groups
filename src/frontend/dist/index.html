<html lang='en'>
    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover' />
        <meta name='format-detection' content='telephone=no' />
        <meta name='msapplication-tap-highlight' content='no' />

        <!-- PWA Meta Tags -->
        <meta name='application-name' content='CivWorld' />
        <meta name='apple-mobile-web-app-capable' content='yes' />
        <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
        <meta name='apple-mobile-web-app-title' content='CivWorld' />
        <meta name='mobile-web-app-capable' content='yes' />
        <meta name='theme-color' content='#0f2d6b' />
        <meta name='msapplication-TileColor' content='#0f2d6b' />
        <meta name='msapplication-TileImage' content='/assets/generated/civworld-icon.dim_512x512.png' />

        <!-- PWA Description -->
        <meta name='description' content='CivWorld - Civic discussion and community platform for informed citizens.' />

        <!-- PWA Manifest -->
        <link rel='manifest' href='/manifest.json' />

        <!-- App Icons -->
        <link rel='icon' type='image/png' href='/assets/generated/civworld-icon.dim_512x512.png' />
        <link rel='apple-touch-icon' href='/assets/generated/civworld-icon.dim_512x512.png' />
        <link rel='apple-touch-icon' sizes='192x192' href='/assets/generated/civworld-icon.dim_512x512.png' />
        <link rel='apple-touch-icon' sizes='512x512' href='/assets/generated/civworld-icon.dim_512x512.png' />

        <!-- Splash screen for iOS -->
        <meta name='apple-mobile-web-app-status-bar-style' content='default' />
        <style>
            /* Splash screen background while app loads */
            body {
                background-color: #0f2d6b;
            }
            #splash {
                position: fixed;
                inset: 0;
                background-color: #0f2d6b;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                transition: opacity 0.4s ease;
            }
            #splash img {
                width: 96px;
                height: 96px;
                border-radius: 22px;
                margin-bottom: 20px;
            }
            #splash span {
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 28px;
                font-weight: 700;
                letter-spacing: -0.5px;
            }
            #splash.hidden {
                opacity: 0;
                pointer-events: none;
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <title>CivWorld - Political and Civic Social Media Platform</title>
      <script type="module" crossorigin src="/assets/index-BlqYhDkU.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-C6s6HnQy.css">
    </head>
    <body>
        <!-- Splash Screen -->
        <div id='splash'>
            <img src='/assets/generated/civworld-icon.dim_512x512.png' alt='CivWorld' />
            <span>CivWorld</span>
        </div>

        <div id='root'></div>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js').catch(function(err) {
                        console.warn('SW registration failed:', err);
                    });
                });
            }

            // Hide splash screen once React app mounts
            window.addEventListener('load', function() {
                setTimeout(function() {
                    var splash = document.getElementById('splash');
                    if (splash) {
                        splash.classList.add('hidden');
                        setTimeout(function() {
                            splash.remove();
                        }, 400);
                    }
                }, 800);
            });
        </script>
    </body>
</html>
